projects:
  - name: AIDAVA
    url: https://www.aidava.eu/about/partners/kul
    en:
      title: Medical language models & multilingual information extraction
      description: Led research on medical language model pretraining and information extraction, from domain knowledge integration and parameter-efficient adaptation to multilingual temporal relation modeling and evaluation.
    zh:
      title: 医疗语言模型与多语言信息抽取
      description: 主导医疗语言模型预训练与信息抽取方向研发，涵盖领域知识整合、参数高效适配、多语言时序关系建模与评测。
  - name: ANTIDOTE
    url: https://univ-cotedazur.eu/antidote/people
    en:
      title: Evidence-based explanations for medical AI
      description: Led method development for medical evidence retrieval, question answering, and explanation generation. Developed weakly supervised argument mining to structure claims, evidence, and their relations.
    zh:
      title: 基于证据的可解释医疗人工智能
      description: 主导医疗证据检索、问答预测与解释生成的方法研发，设计弱监督论辩挖掘方法，对论点、证据及其关系进行结构化建模。
  - name: INTERVENE
    url: https://www.interveneproject.eu/team-1
    en:
      title: Clinical information extraction with limited supervision
      description: Led low-resource information extraction research for Finnish clinical text, using medical ontologies to construct weak supervision and develop domain-adapted named entity recognition models.
    zh:
      title: 低资源临床信息抽取
      description: 主导面向芬兰语临床文本的低资源信息抽取研究，利用医学本体构建弱监督信号，开发经过领域适配的命名实体识别模型。
