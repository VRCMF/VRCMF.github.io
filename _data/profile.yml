  eyebrow: MEDICAL AI · LANGUAGE MODELS
  intro: I study how language models can understand clinical text, reason over evidence, and transfer knowledge across languages.
  bio: I am a PhD researcher in Computer Science at KU Leuven, supervised by Prof. Marie-Francine Moens. My research connects medical natural language processing with multilingual large language models, with a focus on efficient adaptation, knowledge editing, and explainable AI.
  background: Previously, I completed my master's degree at Aalto University under the supervision of Prof. Pekka Marttinen, and my bachelor's degree at Macau University of Science and Technology under Prof. Yanyan Liang. My work brings together method development and clinical applications through collaborations with European research projects and hospitals.
  research: Research interests
  interests:
    - title: Medical language understanding
      text: Clinical information extraction, temporal relations, and automated medical coding.
    - title: Multilingual language models
      text: Knowledge editing, cross-lingual transfer, and inference-time intervention.
    - title: Efficient & explainable AI
      text: Parameter-efficient fine-tuning, evidence-based explanations, and weakly supervised argument mining.
