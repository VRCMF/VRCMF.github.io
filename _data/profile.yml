  graduation: 预计毕业时间 · 2027 年 1 月
  eyebrow: 医疗人工智能 · 大语言模型
  intro: 探索语言模型如何理解临床文本、基于证据推理，并在不同语言之间迁移知识。
  bio: 我目前在比利时鲁汶大学（KU Leuven）攻读计算机科学博士，导师为 Marie-Francine Moens 教授。研究聚焦医疗自然语言处理与多语言大语言模型，重点关注高效适配、知识编辑与可解释人工智能。
  background: 此前，我在阿尔托大学获得硕士学位，导师为 Pekka Marttinen 教授；在澳门科技大学获得学士学位，导师为梁延研教授。我参与多个欧洲科研项目，并与医院合作，将算法研究应用于临床信息理解与医疗人工智能系统。
  research: 研究方向
  interests:
    - title: 医疗语言理解
      text: 临床信息抽取、时序关系建模与自动医疗编码。
    - title: 多语言大语言模型
      text: 知识编辑、跨语言迁移与推理时干预。
    - title: 高效与可解释人工智能
      text: 参数高效微调、基于证据的解释生成与弱监督论辩挖掘。
