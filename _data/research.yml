    en: Refines component boundaries and denoises relations in LLM-generated labels, matching fully supervised argument mining with less than 20% of the human annotations.
    zh: 精修论辩组件边界，并对大模型标注的关系去噪，使用不到 20% 的人工标注数据即可达到全监督模型的相当表现。
- id: langedit
  year: 2025
  title: Mitigating Negative Interference in Multilingual Sequential Knowledge Editing through Null-Space Constraints
  title_zh: 利用零空间约束缓解多语言连续知识编辑中的负干扰
  authors: Wei Sun, Tingyu Qu, Mingxiao Li, Jesse Davis, Marie-Francine Moens
  venue: Findings of ACL 2025 · pp. 8796–8810
  selected: true
  url: https://aclanthology.org/2025.findings-acl.460/
  code: https://github.com/VRCMF/LangEdit
  summary:
    en: LangEdit constrains sequential knowledge updates in null spaces to reduce interference across languages and previously edited knowledge.
    zh: LangEdit 将连续知识更新约束在零空间中，缓解不同语言之间以及新旧编辑知识之间的相互干扰。
