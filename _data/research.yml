    zh: 在低秩瓶颈内显式建模事件对交互，通过 Adapter 与 LoRA 微调提升时序关系抽取能力。
- id: weak-am
  year: 2026
  title: Weakly-supervised Argument Mining with Boundary Refinement and Relation Denoising
  title_zh: 基于边界精修与关系去噪的弱监督论辩挖掘
  authors: Wei Sun, Mingxiao Li, Jesse Davis, Elena Cabrio, Serena Villata, Marie-Francine Moens
  venue: FEVER 2026 · pp. 1–12
  url: https://aclanthology.org/2026.fever-1.1/
