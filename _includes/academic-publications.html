<section class="page-intro"><p>{{ t.publication_intro }}</p><p>{{ t.publication_note }} <a href="{{ site.author.googlescholar }}">Google Scholar</a></p></section>
{% assign year_groups = site.data.research | group_by: 'year' %}
{% for group in year_groups %}
<section class="section publication-year" aria-labelledby="year-{{ group.name }}">
  <div class="section-heading"><h2 id="year-{{ group.name }}">{{ group.name }}</h2></div>
  {% for paper in group.items %}{% include academic-paper.html paper=paper %}{% endfor %}
</section>
{% endfor %}
